<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Expedition</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f8f7f4;
            font-family: Arial, sans-serif;
        }

        .delete-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .delete-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 12px;
            border-top: 5px solid #dc2626;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
            padding: 35px 30px;
            text-align: center;
        }

        .delete-card h2 {
            margin: 0 0 15px;
            color: #172554;
            font-size: 24px;
        }

        .delete-card p {
            margin: 0 0 28px;
            color: #64748b;
            font-size: 15px;
            line-height: 1.7;
        }

        .delete-form {
            display: flex;
            justify-content: center;
        }

        .delete-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-secondary {
            background: #e7e5e4;
            color: #334155;
        }

        .btn-secondary:hover {
            background: #d6d3d1;
        }

        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="delete-container">
        <div class="delete-card">
            <h2>Supprimer l'expédition</h2>
            <p>Êtes-vous sûr de vouloir supprimer cette expédition ?</p>
    
            <form method="post" class="delete-form">
                {% csrf_token %}
                <div class="delete-actions">
                    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
                    <a href="{% url 'listview_expeditions' %}" class="btn btn-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
