<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedition Management</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f7f4;
            color: #263238;
            font-family: Arial, sans-serif;
        }

        main {
            width: 100%;
            max-width: 600px;
            padding: 35px;
            background: white;
            border-radius: 12px;
            border-top: 5px solid #0f766e;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #0f766e;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 30px;
            font-size: 25px;
            color: #172554;
        }

        form p {
            margin: 0 0 18px;
        }

        form label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #334155;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d6d3d1;
            border-radius: 6px;
            background: #fafaf9;
            color: #263238;
            font: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15,118,110,0.12);
        }

        .errorlist {
            margin: 6px 0 0;
            padding-left: 20px;
            color: #dc2626;
            font-size: 13px;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 28px;
        }

        button, .cancel {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 12px 20px;
            border-radius: 6px;
            font: inherit;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            border: none;
            background: #0f766e;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #115e59;
        }

        .cancel {
            border: 1px solid #d6d3d1;
            color: #475569;
            background: white;
        }

        .cancel:hover {
            background: #f5f5f4;
        }

        @media (max-width: 480px) {
            main {
                padding: 25px 20px;
            }

            .actions {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>
    <main>
        <p class="eyebrow">Gestion des expéditions</p>
        {% if object %}
            <h1>Modifier l'expédition {{ object.id }}</h1>
        {% else %}
            <h1>Créer une nouvelle expédition</h1>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions">
                <button type="submit">Enregistrer</button>
                <a class="cancel" href="{% url 'listview_expeditions' %}">Annuler</a>
            </div>
        </form>
    </main>
</body>
</html>
